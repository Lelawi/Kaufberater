name: worker
# Preisabfrage + Tiefenanalyse.
# - Läuft stündlich (private Repos: 2.000 Freiminuten/Monat) und SOFORT, wenn in der App etwas eingetragen wird
#   (die Datenbank stößt diesen Ablauf dann über die GitHub-Schnittstelle an).
# - Die Tiefenanalyse läuft als geplante Claude-Aufgabe (nicht hier).
on:
  schedule:
    - cron: '7 4-21 * * *'     # stündlich 06:07–23:07 Uhr (Sommerzeit)
    - cron: '7 0 * * *'        # nachts einmal
  workflow_dispatch:
    inputs:
      arg:
        description: 'all | checks | deals | discovery | quick | product:<id>'
        required: false
        default: all
concurrency:
  group: worker-${{ startsWith(inputs.arg, 'product:') && inputs.arg || 'main' }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KB_DB_PASSWORD: ${{ secrets.KB_DB_PASSWORD }}
      ARG: ${{ inputs.arg || 'all' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm install --no-audit --no-fund --omit=dev
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' }
      - name: Pausieren, wenn der Heim-Rechner aktiv ist
        id: home
        run: node worker/src/cli.ts homecheck
      - name: Preise abfragen
        if: steps.home.outputs.skip != 'true' || github.event_name == 'workflow_dispatch'
        run: node worker/src/cli.ts run "$ARG"
        env:
          KB_RUNNER: github
          KB_BUDGET_MINUTES: '8'
