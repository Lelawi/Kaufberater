name: dev
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: Befehl
        required: true
        default: dbtest
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: node worker/src/${{ inputs.cmd }}.ts
        env:
          KB_DB_PASSWORD: ${{ secrets.KB_DB_PASSWORD }}
