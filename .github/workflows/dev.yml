name: dev
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: Befehl (explore, adapter, deals, run)
        required: true
        default: explore
      arg:
        description: Argument
        required: false
        default: ''
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: if [ "$CMD" = dbtest ]; then node worker/src/dbtest.ts; else node worker/src/cli.ts "$CMD" "$ARG"; fi
        env:
          CMD: ${{ inputs.cmd }}
          ARG: ${{ inputs.arg }}
          KB_DB_PASSWORD: ${{ secrets.KB_DB_PASSWORD }}
